aid: chefaa
name: Chefaa
description: >-
  Chefaa is Egypt's leading digital pharmacy and pharmacy-benefits platform,
  founded in 2017 and headquartered in Cairo. Its GPS-enabled, AI-powered
  consumer app connects more than 1.5 million monthly users with a nationwide
  network of over 1,500 partner pharmacies, letting patients upload, order,
  schedule, and refill both insured and non-insured prescriptions with home
  delivery, medication reminders, and pharmacist chat support. On the B2B side
  Chefaa operates a full-stack supply layer for pharmacies and corporates —
  including Chefaa Supply (direct procurement with deferred payment and
  consolidated delivery) and the Makhazen pharmacy-supply app — plus the Chefaa
  Prime subscription for SMEs and consumers. Chefaa is a 500 Global portfolio
  company. This profile is maintained by the API Evangelist network; Chefaa
  publishes consumer and B2B web/mobile products but does not expose a public
  developer API program, so the enrichment below is limited to its public web,
  security, and domain surface.
